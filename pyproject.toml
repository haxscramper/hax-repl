[project]
name = "hax-repl"
version = "0.1.0"
description = "POC LLM REPL with session persistence"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.0.20",
    "click>=8.3.1",
    "httpx>=0.28.1",
    "openai>=1.100.2",
    "prompt-toolkit>=3.0.51",
    "pydantic>=2.11.7",
    "pyyaml>=6.0.2",
    "rich>=14.1.0",
    "tantivy>=0.24.0",
]

[project.scripts]
hax-repl = "hax_repl.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hax_repl"]

[dependency-groups]
dev = [
    "isort>=7.0.0",
    "pex>=2.89.1",
]


[tool.isort]
profile = "google"
force_single_line = false
force_sort_within_sections = true
combine_as_imports = true
multi_line_output = 3
line_length = 90
include_trailing_comma = true


[tool.yapf]
based_on_style = "google"
column_limit = 90
indent_width = 4
DISABLE_ENDING_COMMA_HEURISTIC = false
