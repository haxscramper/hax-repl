[project]
name = "hax-repl"
version = "0.1.0"
description = "POC LLM REPL with session persistence"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.0.20",
    "click>=8.3.1",
    "httpx>=0.28.1",
    "openai>=1.100.2",
    "prompt-toolkit>=3.0.51",
    "pydantic>=2.11.7",
    "pyyaml>=6.0.2",
    "rich>=14.1.0",
    "tantivy>=0.24.0",
]

[project.scripts]
hax-repl = "hax_repl.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hax_repl"]

[dependency-groups]
dev = [
    "isort>=7.0.0",
]
